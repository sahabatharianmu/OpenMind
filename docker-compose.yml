version: '3.8'

services:
  openmind:
    build: .
    ports:
      - "12366:8080"
    environment:
      - OPENMIND_DATABASE_HOST=postgres
      - OPENMIND_DATABASE_PORT=5432
      - OPENMIND_DATABASE_USER=postgres
      - OPENMIND_DATABASE_PASSWORD=postgres
      - OPENMIND_DATABASE_DB_NAME=openmind
      - OPENMIND_SECURITY_JWT_SECRET_KEY=dev-secret-key-change-me
      - OPENMIND_SECURITY_CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:5173,https://openmind.pages.dev
      - OPENMIND_SERVER_PORT=8080
      - OPENMIND_SERVER_MODE=release
      - OPENMIND_REDIS_HOST=redis
      - OPENMIND_REDIS_PORT=6379
      - OPENMIND_FEATURE_FLAGS_PROVIDER=local
      - OPENMIND_FEATURE_FLAGS_SDK_KEY=
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "12367:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=openmind
    volumes:
      - openmind_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7-alpine
    ports:
      - "12368:6379"
    volumes:
      - openmind_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  openmind_data:
  openmind_redis_data:
