<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patient Handoff Rejected</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f7fa; margin: 0; padding: 0;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); padding: 30px; text-align: center;">
                <h1 style="color: white; margin: 0; font-size: 24px;">Handoff Rejected</h1>
            </div>
            <div style="padding: 30px;">
                <h2 style="color: #e74c3c; margin-top: 0;">Patient Handoff Rejected</h2>
                <p>Hello,</p>
                <p><strong>{{.RejectingClinicianName}}</strong> has rejected your handoff request for patient <strong>{{.PatientName}}</strong>.</p>
                {{if .Reason}}<p><strong>Reason:</strong> {{.Reason}}</p>{{end}}
            </div>
            <div style="padding: 20px 30px; background-color: #f8f9fa; border-top: 1px solid #ecf0f1;">
                <p style="color: #95a5a6; font-size: 12px; margin: 0;">This is an automated notification from OpenMind Practice.</p>
            </div>
        </div>
    </div>
</body>
</html>
